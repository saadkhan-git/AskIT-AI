  <rect x="40" y="40" width="1320" height="820" rx="26" fill="rgba(15,23,42,0.75)" stroke="#24314d"/>

  <rect x="70" y="78" width="250" height="744" rx="20" fill="#0f172a" stroke="#2a3a5d"/>
